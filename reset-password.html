<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset your password — CURRENT</title>
  <meta name="theme-color" content="#0a2540">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="marine.css">
</head>
<body data-page="reset-password" data-theme="marine">

  <header class="site-header" data-component="header"></header>

  <main id="main" class="onboard">
    <div class="container">
      <div class="onboard__shell" data-reset-password>

        <!-- Step 1: request a reset link -->
        <div class="onboard__card" data-reset-request>
          <p class="eyebrow">CURRENT</p>
          <h1>Reset your password</h1>
          <p class="onboard__lede">Enter your email and we’ll send you a link to reset it.</p>
          <form class="onboard__fields" data-reset-request-form novalidate>
            <label class="field"><span>Email</span><input type="email" data-f-email autocomplete="email" required></label>
            <p class="small field-error" data-form-error hidden></p>
            <p class="small" role="status" aria-live="polite" data-reset-sent hidden>Check your email for a reset link.</p>
            <button class="btn" type="submit" data-submit>Send reset link</button>
          </form>
          <p class="small auth-switch"><a href="login.html">Back to log in</a></p>
        </div>

        <!-- Step 2: shown once Supabase recognizes this page was opened from a reset link -->
        <div class="onboard__card" data-reset-update hidden>
          <p class="eyebrow">CURRENT</p>
          <h1>Choose a new password</h1>
          <form class="onboard__fields" data-reset-update-form novalidate>
            <label class="field"><span>New password</span><input type="password" data-f-password autocomplete="new-password" minlength="8" required></label>
            <label class="field"><span>Confirm new password</span><input type="password" data-f-confirm autocomplete="new-password" minlength="8" required></label>
            <p class="small field-error" data-form-error hidden></p>
            <button class="btn" type="submit" data-submit>Update password</button>
          </form>
        </div>

      </div>
    </div>
  </main>

  <footer class="site-footer" data-component="footer"></footer>

  <script src="data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="auth.js"></script>
  <script src="script.js"></script>
  <script src="auth-pages.js"></script>
</body>
</html>
