<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check your email — CURRENT</title>
  <meta name="theme-color" content="#0a2540">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="marine.css">
</head>
<body data-page="check-email" data-theme="marine">

  <header class="site-header" data-component="header"></header>

  <main id="main" class="onboard">
    <div class="container">
      <div class="onboard__shell" data-check-email>
        <div class="onboard__card">
          <p class="eyebrow">CURRENT</p>
          <h1>Check your email</h1>
          <p class="onboard__lede">We sent you a verification link.<br>Verify your email to continue to CURRENT.</p>
          <div class="onboard__fields">
            <button class="btn btn--ghost" type="button" data-resend>Resend email</button>
            <p class="small" role="status" aria-live="polite" data-status></p>
            <p class="small auth-switch"><a href="login.html">Back to log in</a></p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer" data-component="footer"></footer>

  <script src="data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="auth.js"></script>
  <script src="script.js"></script>
  <script src="auth-pages.js"></script>
</body>
</html>
